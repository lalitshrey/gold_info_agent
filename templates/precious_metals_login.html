<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in | Market Desk</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #19251f; background: #f2f5ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px; background: radial-gradient(ellipse at 20% 15%, #e3ecdf, transparent 44%), #f2f5ef; }
    .login-card { width: min(100%, 420px); padding: 34px; border: 1px solid #e3e9e0; border-radius: 20px; background: #fff; box-shadow: 0 18px 55px #1e332314; }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 31px; font-size: 14px; font-weight: 750; }
    .brand-mark { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 13px; color: white; background: #244c3b; font-size: 20px; }
    .eyebrow { color: #728078; margin: 0 0 9px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 29px; letter-spacing: -.05em; }
    .subtitle { margin: 10px 0 24px; color: #758178; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; color: #46564d; font-size: 13px; font-weight: 700; }
    input { width: 100%; min-height: 45px; padding: 10px 12px; border: 1px solid #dce4da; border-radius: 10px; color: #19251f; background: #fff; font: inherit; }
    input:focus { outline: 3px solid #cfe0d1; border-color: #548267; }
    button { width: 100%; min-height: 45px; margin-top: 23px; border: 0; border-radius: 10px; background: #244c3b; color: #fff; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; }
    button:hover { background: #193c2d; }
    .error { padding: 11px 12px; border-radius: 9px; color: #a13d38; background: #fff0ee; font-size: 13px; }
    .footnote { margin: 20px 0 0; color: #8a958d; text-align: center; font-size: 11px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><span>Market Desk</span></div>
    <p class="eyebrow">Precious metals · India</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to view gold, silver, and currency market data.</p>
    <div id="login-error" class="error" role="alert" hidden>{{ERROR}}</div>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="footnote">Market quotes are provided by external data sources.</p>
  </main>
  <script>
    const error = document.getElementById("login-error");
    if (error.textContent.trim()) error.hidden = false;
  </script>
</body>
</html>
